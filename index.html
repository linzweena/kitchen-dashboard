<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>Kitchen Board</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a20; --panel2:#1d2129; --line:#272c36;
  --text:#eef0f3; --muted:#8b93a1; --faint:#5b6270;
  --accent:#7cc4ff; --ok:#5fd38d; --warn:#f2b84b; --bad:#ff6b6b;
  --radius:16px; --gap:14px;
  font-size:clamp(14px, 1.45vw, 22px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
body{transition:filter 2s ease}
#app{height:100vh;display:flex;flex-direction:column;padding:var(--gap);gap:var(--gap);transition:transform 3s ease}
header{display:flex;align-items:flex-end;gap:1.2rem;padding:0 .3rem}
#clock{font-size:4.2rem;font-weight:300;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums;cursor:default}
#date{font-size:1.5rem;color:var(--muted);padding-bottom:.25rem}
#status{margin-left:auto;display:flex;gap:.9rem;align-items:center;font-size:.8rem;color:var(--muted);padding-bottom:.35rem;flex-wrap:wrap;justify-content:flex-end}
.st{display:flex;align-items:center;gap:.35rem;white-space:nowrap}
.dot{width:.6rem;height:.6rem;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
#banner{background:#2a2410;color:#f6d98a;border:1px solid #4a3f17;border-radius:12px;padding:.55rem 1rem;font-size:.9rem;display:flex;gap:1rem;align-items:center}
#banner[hidden]{display:none}
#banner button{margin-left:auto}
main{flex:1;min-height:0;display:grid;gap:var(--gap);
  grid-template-columns:1.35fr 1fr 1fr;grid-template-rows:1fr 1fr;
  grid-template-areas:"cal meals shop" "cal rem shop"}
#p-cal{grid-area:cal} #p-meals{grid-area:meals} #p-rem{grid-area:rem} #p-shop{grid-area:shop}
@media (orientation:portrait){
  main{grid-template-columns:1fr 1fr;grid-template-rows:1.3fr 1fr 1fr;grid-template-areas:"cal cal" "meals shop" "rem shop"}
  :root{font-size:clamp(14px,2.3vw,24px)}
}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel h2{margin:0;padding:.75rem 1rem .5rem;font-size:.85rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:.5rem}
.panel h2 .count{margin-left:auto;color:var(--faint);letter-spacing:0}
.body{flex:1;overflow-y:auto;padding:0 1rem .8rem;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.empty{color:var(--faint);padding:.6rem 0;font-size:.95rem}

/* calendar */
.day{margin-top:.5rem}
.day-h{font-size:.85rem;color:var(--muted);font-weight:600;padding:.35rem 0 .25rem;border-bottom:1px solid var(--line);margin-bottom:.25rem;display:flex}
.day.today .day-h{color:var(--accent)}
.day.quiet .day-h{color:var(--faint);font-weight:500}
.ev{display:flex;gap:.65rem;align-items:baseline;padding:.32rem 0}
.ev .bar{align-self:stretch;width:4px;border-radius:2px;flex:none}
.ev .t{flex:none;width:4.4rem;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem}
.ev .n{flex:1;min-width:0;font-size:1.05rem;line-height:1.25}
.ev .loc{display:block;color:var(--faint);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.past{opacity:.38}
.ev.now .t{color:var(--accent);font-weight:600}
.ev .who{display:inline-block;font-size:.72rem;font-weight:600;line-height:1;padding:.22rem .5rem;border-radius:99px;margin-left:.45rem;vertical-align:.12em;white-space:nowrap}
.legend{margin-left:auto;display:flex;gap:.7rem;flex-wrap:wrap;justify-content:flex-end;text-transform:none;letter-spacing:0;font-weight:500;font-size:.8rem;color:var(--text)}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.sw{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;flex:none}
.cal-end{color:var(--faint);font-size:.85rem;padding:.8rem 0 .2rem;text-align:center}

/* meals */
.meal{display:flex;gap:.8rem;padding:.42rem 0;border-bottom:1px solid var(--line);align-items:baseline}
.meal:last-child{border-bottom:0}
.meal .d{width:2.8rem;flex:none;color:var(--muted);font-size:.85rem;font-weight:600;text-transform:uppercase}
.meal .m{flex:1;font-size:1.05rem}
.meal .m.none{color:var(--faint)}
.meal.today .d,.meal.today .m{color:var(--accent)}

/* tasks */
.task{display:flex;gap:.75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border-bottom:0}
.box{width:1.35rem;height:1.35rem;border:2px solid var(--faint);border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--bg)}
.task .c{flex:1;min-width:0;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
.task .due{flex:none;font-size:.8rem;color:var(--muted);text-align:right}
.task .due.over{color:var(--bad)}
.task.pdone .box{background:var(--ok);border-color:var(--ok)}
.task.pdone .box::after{content:"✓"}
.task.pdone .c{text-decoration:line-through;color:var(--faint)}
.task.unsynced .c::after{content:" ⟳";color:var(--faint);font-size:.8rem}
.sec{font-size:.75rem;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;padding:.7rem 0 .1rem}
#shop-add{display:flex;gap:.5rem;padding:.6rem 1rem .9rem;border-top:1px solid var(--line)}
#shop-add input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:.55rem .8rem;font:inherit;-webkit-user-select:text;user-select:text}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.5rem .9rem;font:inherit;font-size:.9rem;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:600}

/* night */
body.night{filter:brightness(.45)}
body.night .ev.past{opacity:.25}

/* settings */
#settings{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:10}
#settings[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);width:min(920px,94vw);max-height:92vh;display:flex;flex-direction:column;-webkit-user-select:text;user-select:text}
.sheet header{padding:1rem 1.2rem;border-bottom:1px solid var(--line);align-items:center}
.sheet header h3{margin:0;font-size:1.2rem;font-weight:600}
.sheet header .sp{flex:1}
.sheet .scroll{overflow-y:auto;padding:0 1.2rem 1.2rem}
.sheet fieldset{border:0;border-top:1px solid var(--line);margin:1rem 0 0;padding:.8rem 0 0;display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem}
.sheet legend{font-weight:600;color:var(--accent);padding:0 .4rem 0 0}
.sheet label{display:flex;flex-direction:column;gap:.3rem;font-size:.85rem;color:var(--muted)}
.sheet label.wide{grid-column:1/-1}
.sheet input,.sheet select,.sheet textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:.5rem .65rem;font:inherit;font-size:.9rem}
.sheet textarea{min-height:5.5rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.sheet small{color:var(--faint);font-size:.75rem}
.sheet .row{grid-column:1/-1;display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;color:var(--accent);letter-spacing:.1em}
#diag{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;color:var(--muted);grid-column:1/-1;background:var(--panel2);border-radius:8px;padding:.6rem;max-height:12rem;overflow:auto}

/* photo screen saver */
#saver{position:fixed;inset:0;background:#000;z-index:5;overflow:hidden;cursor:none}
#saver[hidden]{display:none}
#saver .layer{position:absolute;inset:0;opacity:0;transition:opacity 2s ease}
#saver .layer.show{opacity:1}
#saver img{position:absolute;inset:0;width:100%;height:100%}
#saver .bg{object-fit:cover;filter:blur(40px) brightness(.45);transform:scale(1.15)}
#saver .fg{object-fit:contain}
#saver .layer.show .fg{animation:kb-drift var(--photo-secs,20s) ease-out forwards}
@keyframes kb-drift{from{transform:scale(1)}to{transform:scale(1.05)}}
#sv-rotate{position:absolute;top:1.2rem;right:1.2rem;z-index:2;width:3.6rem;height:3.6rem;border-radius:50%;border:2px solid rgba(255,255,255,.55);
  background:rgba(0,0,0,.35);color:#fff;font-size:1.9rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;opacity:.75;cursor:pointer}
#sv-rotate:active{background:rgba(255,255,255,.3)}
#saver-info{position:absolute;left:0;right:0;bottom:0;padding:3rem 2rem 1.4rem;display:flex;align-items:flex-end;gap:2rem;
  background:linear-gradient(transparent,rgba(0,0,0,.75) 55%);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#sv-time{font-size:4rem;font-weight:300;line-height:.9;font-variant-numeric:tabular-nums}
#sv-date{font-size:1.2rem;opacity:.8;margin-top:.4rem}
#sv-items{margin-left:auto;display:flex;flex-direction:column;gap:.35rem;align-items:flex-end;font-size:1.15rem;text-align:right;max-width:55%}
#sv-items .lbl{opacity:.65;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;margin-right:.5rem}
#sv-items .over{color:#ff9b9b}
@media (orientation:portrait){#saver-info{flex-direction:column;align-items:flex-start;gap:1rem}#sv-items{margin-left:0;align-items:flex-start;text-align:left;max-width:100%}}

/* seasonal decorations — purely visual, never catch taps */
#decor{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
body.night #decor,body.night #decor-head{display:none}
#decor .p{position:absolute;top:0;left:var(--x);font-size:var(--size);opacity:.85;will-change:transform;
  animation:var(--anim) var(--dur) linear var(--delay) infinite}
#decor .p>span{display:inline-block;animation:kb-sway calc(var(--dur)/4) ease-in-out infinite alternate}
@keyframes kb-fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(112vh) rotate(var(--spin,200deg))}}
@keyframes kb-rise{from{transform:translateY(112vh)}to{transform:translateY(-18vh)}}
@keyframes kb-fly{0%{transform:translate(-12vw,var(--y))}50%{transform:translate(50vw,calc(var(--y) - 6vh))}100%{transform:translate(112vw,var(--y))}}
@keyframes kb-sway{from{transform:translateX(calc(var(--drift) * -1))}to{transform:translateX(var(--drift))}}
#decor .p.fly{left:0}
#decor .p.fly>span{animation-name:kb-flap;animation-duration:.5s}
@keyframes kb-flap{from{transform:scaleY(1)}to{transform:scaleY(.6)}}
#decor .snow{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.6)}
/* fireworks */
#decor .fw{position:absolute;width:0;height:0}
#decor .fw i{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c),0 0 14px var(--c);
  animation:kb-burst 1.6s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes kb-burst{0%{transform:rotate(var(--a)) translateX(0);opacity:1}70%{opacity:1}100%{transform:rotate(var(--a)) translateX(var(--r)) translateY(30px);opacity:0}}
/* christmas lights */
#decor .lights{position:absolute;left:0;right:0;top:-2px;height:22px;display:flex;justify-content:space-around;
  background:radial-gradient(ellipse at 50% -40%,transparent 60%,rgba(40,70,40,.9) 62%,transparent 66%) 0 0/60px 22px repeat-x}
#decor .lights b{width:9px;height:13px;margin-top:8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--c);box-shadow:0 0 10px var(--c);
  animation:kb-twinkle 1.6s ease-in-out infinite alternate;animation-delay:var(--d)}
@keyframes kb-twinkle{from{opacity:1}to{opacity:.25}}
#decor-head{flex:1;text-align:center;font-size:1.6rem;padding-bottom:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#decor-head .msg{font-size:1.3rem;font-weight:600;color:#ffd36b;margin:0 .5rem;vertical-align:middle}
body.paused *{animation-play-state:paused!important}
#apps{display:flex;gap:.5rem;align-items:center;padding-bottom:.3rem;flex-wrap:wrap}
#apps button{display:flex;align-items:center;gap:.4rem;border-radius:99px;padding:.45rem .9rem;font-size:.9rem;background:var(--panel2)}
#apps button .ic{font-size:1.2rem;line-height:1}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:#2a2410;color:#f6d98a;border:1px solid #4a3f17;border-radius:12px;
  padding:.7rem 1.1rem;font-size:.95rem;z-index:20;max-width:90vw;text-align:center}
#toast[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <div id="decor-head"></div>
    <div id="apps"></div>
    <div id="status"></div>
  </header>
  <div id="banner" hidden></div>
  <main>
    <section class="panel" id="p-cal"><h2>Calendar <span class="legend" id="cal-legend"></span></h2><div class="body" id="cal-body"></div></section>
    <section class="panel" id="p-meals"><h2>Meals</h2><div class="body" id="meals-body"></div></section>
    <section class="panel" id="p-rem"><h2>Reminders <span class="count" id="rem-count"></span></h2><div class="body" id="rem-body"></div></section>
    <section class="panel" id="p-shop">
      <h2>Shopping <span class="count" id="shop-count"></span></h2>
      <div class="body" id="shop-body"></div>
      <form id="shop-add" autocomplete="off"><input id="shop-input" placeholder="Add item…" enterkeyhint="done"><button class="primary">Add</button></form>
    </section>
  </main>
</div>
<div id="settings" hidden></div>
<div id="decor"></div>
<div id="toast" hidden></div>
<div id="saver" hidden>
  <div class="layer"><img class="bg" alt=""><img class="fg" alt=""></div>
  <div class="layer"><img class="bg" alt=""><img class="fg" alt=""></div>
  <button id="sv-rotate" type="button" aria-label="Turn this photo">↻</button>
  <div id="saver-info"><div><div id="sv-time"></div><div id="sv-date"></div></div><div id="sv-items"></div></div>
</div>

<script>
'use strict';
/* =====================================================================
   Kitchen Board — single-page wall display.
   Data:  Google Calendar API (calendar) + Todoist API v1 (shopping, meals, reminders)
   Every dataset is cached in localStorage, so the board always renders the
   last good data, even after a reboot with no network.
   Settings: long-press the clock for 2 seconds (or open the page with ?settings).
   ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- storage (never throws) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { console.warn('storage', e); return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const K = { cfg:'kb.config', cache:'kb.cache.', queue:'kb.queue', gtoken:'kb.gtoken', log:'kb.log' };

/* ---------- config ---------- */
const DEFAULTS = {
  calendarMode: 'script',           // 'script' (Apps Script in your own Google account) | 'apikey' (public calendars) | 'oauth'
  calendarScriptUrl: '',            // the Apps Script web app address, ending in /exec
  googleApiKey: '', googleClientId: '', googleClientSecret: '',
  calendars: '',                    // one per line:  calendarId | Label | #colour
  calendarDays: 30,
  todoistToken: '',
  shoppingProject: 'Shopping',
  mealsProject: 'Meals',
  remindersFilter: '(overdue | today | next 2 days) & #Reminders',
  mealDays: 7,
  refreshMinutes: 5,
  nightStart: '22:00', nightEnd: '06:30',
  dayBrightness: '', nightBrightness: '10',   // Fully Kiosk brightness 0–255; blank = leave alone
  reloadAt: '03:30',
  photoIdleMinutes: '5',            // photo screen saver: minutes untouched before it starts; 0 = off
  photoSeconds: '20',               // seconds per photo
  decorations: 'on',
  birthdays: '09/01\n20/02\n25/08',  // one per line: DD/MM | Name (name optional)
  anniversaries: '05/05',            // same format
  summerHolidays: '22/07 - 03/09',   // DD/MM - DD/MM
  colour0Hex: '#d81b60',             // colour for events with no colour of their own (Cherry blossom)
  apps: ''                           // app buttons, one per line: emoji | Name | Play Store link (or package name)
};
let cfg = Object.assign({}, DEFAULTS, store.get(K.cfg, {}));
if (store.get(K.cfg, null) && !(cfg.cfgV >= 2)) {      // one-time upgrade: 7-day calendar → 30 days
  if (Number(cfg.calendarDays) === 7) cfg.calendarDays = 30;
  cfg.cfgV = 2; store.set(K.cfg, cfg);
}
/* ---------- app buttons (opens other apps through Fully Kiosk) ---------- */
function parseApps() {
  return String(cfg.apps || '').split('\n').map(l => l.split('|').map(x => x.trim())).filter(a => a.length >= 3 && a[2]).map(a => {
    const m = /[?&]id=([\w.]+)/.exec(a[2]);
    const pkg = m ? m[1] : (/^[a-z][\w]*(\.[\w]+)+$/i.test(a[2]) ? a[2] : '');
    return { icon: a[0], name: a[1], pkg };
  }).filter(a => a.pkg);
}
function renderApps() {
  $('#apps').innerHTML = parseApps().map(a => '<button type="button" data-app="' + esc(a.pkg) + '"><span class="ic">' + esc(a.icon) + '</span>' + esc(a.name) + '</button>').join('');
}
let toastTimer = null;
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, ms || 6000); }
function launchApp(pkg) {
  try {
    if (window.fully && typeof fully.startApplication === 'function') { fully.startApplication(pkg); return; }
  } catch (e) { log('launch: ' + e.message); }
  toast('Can’t open apps yet — in Fully Kiosk’s settings, turn on “Enable JavaScript Interface” (under Advanced Web Settings).', 9000);
}

/* Google Calendar's event colours (as shown in its colour picker), in picker order */
const GCOLOURS = [['11', 'Tomato', '#d50000'], ['4', 'Flamingo', '#e67c73'], ['6', 'Tangerine', '#f4511e'], ['5', 'Banana', '#f6bf26'],
  ['2', 'Sage', '#33b679'], ['10', 'Basil', '#0b8043'], ['7', 'Peacock', '#039be5'], ['9', 'Blueberry', '#3f51b5'],
  ['1', 'Lavender', '#7986cb'], ['3', 'Grape', '#8e24aa'], ['8', 'Graphite', '#616161']];
const GCOLOUR = {}; GCOLOURS.forEach(c => GCOLOUR[c[0]] = c);
/* calendar-level colours from Google's picker (close matches), for events that use their calendar's colour */
const CALCOLOURS = [['Cherry blossom', '#d81b60'], ['Radicchio', '#ad1457'], ['Tomato', '#d50000'], ['Flamingo', '#e67c73'], ['Tangerine', '#f4511e'],
  ['Pumpkin', '#ef6c00'], ['Mango', '#f09300'], ['Banana', '#f6bf26'], ['Citron', '#e4c441'], ['Avocado', '#c0ca33'], ['Pistachio', '#7cb342'],
  ['Sage', '#33b679'], ['Basil', '#0b8043'], ['Eucalyptus', '#009688'], ['Peacock', '#039be5'], ['Cobalt', '#4285f4'], ['Blueberry', '#3f51b5'],
  ['Lavender', '#7986cb'], ['Wisteria', '#b39ddb'], ['Amethyst', '#9e69af'], ['Grape', '#8e24aa'], ['Cocoa', '#795548'], ['Birch', '#a79b8e'], ['Graphite', '#616161']];
const inkFor = hex => { const n = parseInt(String(hex).replace('#', '').slice(0, 6), 16); if (isNaN(n)) return '#fff';
  const r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 160 ? '#111' : '#fff'; };
const PALETTE = ['#7cc4ff','#ff9f7c','#9be08a','#d4a5ff','#ffd36b','#6be0d4','#ff8fc2'];

function parseCalendars() {
  return String(cfg.calendars || '').split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'))
    .map((l, i) => { const [id, label, color] = l.split('|').map(s => (s || '').trim());
      return { id, label: label || '', color: color || PALETTE[i % PALETTE.length] }; });
}
const num = (v, d) => { const n = Number(v); return isFinite(n) && n > 0 ? n : d; };
const refreshMs = () => num(cfg.refreshMinutes, 5) * 60e3;

/* ---------- diagnostics log (kept small, shown in settings) ---------- */
function log(msg) {
  const line = new Date().toISOString().slice(5, 19).replace('T', ' ') + '  ' + msg;
  console.log(line);
  const l = store.get(K.log, []); l.push(line); store.set(K.log, l.slice(-40));
}
window.addEventListener('error', e => log('error: ' + (e.message || e.type)));
window.addEventListener('unhandledrejection', e => log('rejection: ' + (e.reason && e.reason.message || e.reason)));

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const parseYmd = s => { const [y, m, d] = s.slice(0, 10).split('-').map(Number); return new Date(y, m - 1, d); };
const fmtTime = d => d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const dayDiff = d => Math.round((startOfDay(d) - startOfDay(new Date())) / 864e5);
function dayLabel(d) {
  const n = dayDiff(d);
  if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'short' });
}
function ago(t) {
  const m = Math.round((Date.now() - t) / 60e3);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  if (m < 1440) return Math.round(m / 60) + ' h ago';
  return new Date(t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
}
const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim()); return m ? +m[1] * 60 + +m[2] : null; };
/* Todoist due: 'YYYY-MM-DD' (all day) or a datetime (floating or UTC) */
const dueDate = due => due && due.date ? (due.date.length > 10 ? new Date(due.date) : parseYmd(due.date)) : null;
const dueHasTime = due => !!(due && due.date && due.date.length > 10);

/* ---------- HTTP with timeout ---------- */
class HttpError extends Error { constructor(status, body) { super('HTTP ' + status); this.status = status; this.body = body; } }
async function http(url, opts, timeout) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), timeout || 20000);
  try {
    const r = await fetch(url, Object.assign({ cache: 'no-store' }, opts || {}, ctl ? { signal: ctl.signal } : {}));
    const text = await r.text();
    let body = null; try { body = text ? JSON.parse(text) : null; } catch (e) { body = text; }
    if (!r.ok) throw new HttpError(r.status, body);
    return body;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('timed out');
    throw e;
  } finally { clearTimeout(timer); }
}
function errMsg(e) {
  if (!e) return 'unknown error';
  if (e.status === 401 || e.status === 403) return 'access denied (' + e.status + ') — check key/token';
  if (e.status === 404) return 'not found (404)';
  if (e.status === 429) return 'rate limited';
  if (e.status) return 'server error ' + e.status;
  if (e instanceof TypeError) return 'network unreachable';
  return e.message || String(e);
}

/* =====================================================================
   Google Calendar
   ===================================================================== */
const G_TOKEN_URL = 'https://oauth2.googleapis.com/token';
const G_SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';

async function googleAuth(force) {
  if (cfg.calendarMode !== 'oauth') return null;
  let tok = store.get(K.gtoken, null);
  if (!tok || !tok.refresh_token) throw new Error('Google not connected — open settings');
  if (tok.revoked) throw new Error('Google sign-in expired — reconnect in settings');
  if (force || !tok.access_token || Date.now() > (tok.expires_at || 0) - 120e3) {
    try {
      const r = await http(G_TOKEN_URL, { method: 'POST', body: new URLSearchParams({
        client_id: cfg.googleClientId, client_secret: cfg.googleClientSecret,
        refresh_token: tok.refresh_token, grant_type: 'refresh_token' }) });
      tok.access_token = r.access_token; tok.expires_at = Date.now() + (r.expires_in || 3600) * 1000;
      store.set(K.gtoken, tok);
    } catch (e) {
      if (e.body && e.body.error === 'invalid_grant') { tok.revoked = true; store.set(K.gtoken, tok); log('google refresh token revoked'); throw new Error('Google sign-in expired — reconnect in settings'); }
      throw e;
    }
  }
  return 'Bearer ' + tok.access_token;
}

async function fetchCalendar(cal, from, to, auth) {
  const out = []; let pageToken = '';
  do {
    const p = new URLSearchParams({ singleEvents: 'true', orderBy: 'startTime', maxResults: '250',
      timeMin: from.toISOString(), timeMax: to.toISOString() });
    if (pageToken) p.set('pageToken', pageToken);
    if (!auth) p.set('key', cfg.googleApiKey);
    const r = await http('https://www.googleapis.com/calendar/v3/calendars/' + encodeURIComponent(cal.id) + '/events?' + p,
      auth ? { headers: { Authorization: auth } } : {});
    (r.items || []).forEach(ev => {
      if (ev.status === 'cancelled' || !ev.start) return;
      out.push({ title: ev.summary || '(busy)', allDay: !!ev.start.date,
        start: ev.start.dateTime || ev.start.date, end: ev.end ? (ev.end.dateTime || ev.end.date) : null,
        location: ev.location || '' });
    });
    pageToken = r.nextPageToken;
  } while (pageToken);
  return out;
}

/* Apps Script bridge: a tiny script in the family's own Google account reads their calendars
   and returns them as JSON. No Cloud project, no sign-in that expires. See google-apps-script.js. */
async function fetchCalendarScript() {
  const url = String(cfg.calendarScriptUrl).trim();
  const r = await http(url + (url.includes('?') ? '&' : '?') + 'days=' + num(cfg.calendarDays, 7), {}, 45000);
  if (!r || !Array.isArray(r.calendars)) throw new Error(r && r.error ? 'calendar script: ' + r.error : 'calendar script address not working — check it ends in /exec and access is “Anyone”');
  return r.calendars;
}
async function loadCalendarScript() {
  const ids = parseCalendars().map(c => c.id);            // blank list = show every calendar
  const out = { byCal: {}, meta: {}, errors: [] };
  (await fetchCalendarScript()).forEach(c => {
    if (ids.length && !ids.includes(c.id)) return;
    out.byCal[c.id] = c.events || []; out.meta[c.id] = { label: c.name || '', color: c.color || '' };
  });
  return out;
}

async function loadCalendar(prev) {
  if (cfg.calendarMode === 'script') return loadCalendarScript();
  const cals = parseCalendars();
  const from = addDays(startOfDay(new Date()), -1), to = addDays(startOfDay(new Date()), num(cfg.calendarDays, 7) + 1);
  let auth = await googleAuth(false);
  const out = { byCal: {}, errors: [] };
  for (const c of cals) {            // sequential: gentle on quota, and lets a 401 refresh once
    try { out.byCal[c.id] = await fetchCalendar(c, from, to, auth); }
    catch (e) {
      if (e.status === 401 && auth) {
        try { auth = await googleAuth(true); out.byCal[c.id] = await fetchCalendar(c, from, to, auth); continue; } catch (e2) { e = e2; }
      }
      out.errors.push((c.label || c.id) + ': ' + errMsg(e));
      if (prev && prev.byCal && prev.byCal[c.id]) out.byCal[c.id] = prev.byCal[c.id];   // keep last good copy
    }
  }
  if (cals.length && out.errors.length === cals.length) throw new Error(out.errors.join('; '));
  return out;
}

/* Device sign-in ("TVs and limited input devices"): code shown on the tablet, approved on a phone. */
async function connectGoogle(clientId, clientSecret, box) {
  box.textContent = 'Requesting code…';
  try {
    const r = await http('https://oauth2.googleapis.com/device/code', { method: 'POST',
      body: new URLSearchParams({ client_id: clientId, scope: G_SCOPE }) });
    box.innerHTML = 'On your phone open <b>' + esc(r.verification_url || r.verification_uri) + '</b> and enter<br><span class="code">' + esc(r.user_code) + '</span>';
    let interval = (r.interval || 5) * 1000; const deadline = Date.now() + (r.expires_in || 1800) * 1000;
    while (Date.now() < deadline && !$('#settings').hidden) {
      await sleep(interval);
      try {
        const t = await http(G_TOKEN_URL, { method: 'POST', body: new URLSearchParams({ client_id: clientId, client_secret: clientSecret,
          device_code: r.device_code, grant_type: 'urn:ietf:params:oauth:grant-type:device_code' }) });
        store.set(K.gtoken, { refresh_token: t.refresh_token, access_token: t.access_token, expires_at: Date.now() + t.expires_in * 1000 });
        box.innerHTML = '<b style="color:var(--ok)">Connected ✓</b> — now press “List my calendars” or Save.';
        log('google connected');
        return;
      } catch (e) {
        const code = e.body && e.body.error;
        if (code === 'authorization_pending') continue;
        if (code === 'slow_down') { interval += 5000; continue; }
        box.textContent = 'Sign-in failed: ' + (code || errMsg(e)); return;
      }
    }
    box.textContent = 'Code expired — try again.';
  } catch (e) { box.textContent = 'Could not start sign-in: ' + ((e.body && e.body.error_description) || errMsg(e)); }
}

/* =====================================================================
   Todoist (API v1)  — shopping project, meals project, reminders filter
   ===================================================================== */
const TD = 'https://api.todoist.com/api/v1';
const tdHeaders = json => Object.assign({ Authorization: 'Bearer ' + cfg.todoistToken }, json ? { 'Content-Type': 'application/json' } : {});

async function tdList(path, params) {
  const all = []; let cursor = null, guard = 0;
  do {
    const p = new URLSearchParams(params || {}); p.set('limit', '200'); if (cursor) p.set('cursor', cursor);
    const r = await http(TD + path + '?' + p, { headers: tdHeaders() });
    const rows = Array.isArray(r) ? r : (r && r.results) || [];
    all.push.apply(all, rows);
    cursor = Array.isArray(r) ? null : r && r.next_cursor;
  } while (cursor && ++guard < 20);
  return all;
}

/* Offline write queue: completions and additions survive network loss and reboots. */
let queue = store.get(K.queue, []);
const saveQueue = () => store.set(K.queue, queue);

async function flushQueue() {
  while (queue.length) {
    const q = queue[0];
    try {
      if (q.op === 'close') {
        await http(TD + '/tasks/' + encodeURIComponent(q.id) + '/close', { method: 'POST', headers: tdHeaders() });
        const c = state.cache.todoist;       // drop from cache so it can't flash back if the next read fails
        if (c) ['shopping', 'meals', 'reminders'].forEach(k => { c.data[k] = c.data[k].filter(t => String(t.id) !== String(q.id)); });
      } else if (q.op === 'add') {
        await http(TD + '/tasks', { method: 'POST', headers: tdHeaders(true), body: JSON.stringify({ content: q.content, project_id: q.projectId }) });
      }
      queue.shift(); saveQueue();
    } catch (e) {
      if (e.status === 400 || e.status === 404 || e.status === 410) {   // permanently invalid (e.g. task deleted elsewhere)
        log('dropping queued ' + q.op + ' (' + e.status + ')'); queue.shift(); saveQueue(); continue;
      }
      throw e;                                                          // offline / auth / 5xx: keep and retry later
    }
  }
}

async function loadTodoist(prev) {
  let flushErr = null;
  try { await flushQueue(); } catch (e) { flushErr = e; }
  const projects = await tdList('/projects');
  const find = name => {
    if (!String(name || '').trim()) return null;
    const p = projects.find(p => p.name.trim().toLowerCase() === name.trim().toLowerCase());
    if (!p) throw new Error('Todoist project “' + name + '” not found');
    return p.id;
  };
  const shopId = find(cfg.shoppingProject), mealId = find(cfg.mealsProject);
  const errors = [];
  const part = (label, enabled, fn) => !enabled ? Promise.resolve(null) : fn().catch(e => { errors.push(label + ': ' + errMsg(e)); return undefined; });
  const [shop, sections, meals, rem] = await Promise.all([
    part('Shopping', shopId, () => tdList('/tasks', { project_id: shopId })),
    part('Aisles', shopId, () => tdList('/sections', { project_id: shopId })),
    part('Meals', mealId, () => tdList('/tasks', { project_id: mealId })),
    part('Reminders', String(cfg.remindersFilter || '').trim(), () => tdList('/tasks/filter', { query: cfg.remindersFilter }))
  ]);
  if (errors.length === 4 || (errors.length && !prev)) throw new Error(errors.join('; '));   // nothing usable came back
  const slim = t => ({ id: String(t.id), content: t.content, section: t.section_id || null,
    order: t.child_order != null ? t.child_order : (t.order || 0), parent: t.parent_id || null,
    due: t.due ? { date: t.due.date, recurring: !!t.due.is_recurring } : null });
  if (flushErr) log('todoist sync of queued changes failed: ' + errMsg(flushErr));
  const keep = (fresh, key, map) => fresh === undefined ? ((prev && prev[key]) || []) : (fresh || []).map(map);   // failed → last good copy
  if (errors.length) log('todoist partly updated: ' + errors.join('; '));
  return { shopId, shopping: keep(shop, 'shopping', slim), meals: keep(meals, 'meals', slim), reminders: keep(rem, 'reminders', slim),
    sections: keep(sections, 'sections', s => ({ id: s.id, name: s.name, order: s.section_order || s.order || 0 })),
    errors: errors.concat(flushErr ? [queue.length + ' change(s) not yet synced'] : []) };
}

/* =====================================================================
   State, cache and scheduler
   ===================================================================== */
const SOURCES = {
  calendar: { name: 'Calendar', load: loadCalendar, enabled: () => cfg.calendarMode === 'script' ? !!String(cfg.calendarScriptUrl || '').trim()
    : parseCalendars().length > 0 && (cfg.calendarMode === 'oauth' ? !!cfg.googleClientId : !!cfg.googleApiKey) },
  todoist:  { name: 'Todoist',  enabled: () => !!cfg.todoistToken, load: loadTodoist }
};
const state = { cache: {}, status: {}, timers: {}, demo: false, night: null, bootAt: Date.now() };

Object.keys(SOURCES).forEach(k => {
  state.status[k] = { failures: 0, lastAttempt: 0, lastError: '', running: false, startedAt: 0 };
  const c = store.get(K.cache + k, null);
  if (c && c.data && c.at) state.cache[k] = c;
});

function schedule(key, delay) {
  state.due = state.due || {};
  state.due[key] = Date.now() + Math.max(0, delay);
  clearTimeout(state.timers[key]);
  state.timers[key] = setTimeout(() => run(key), Math.max(0, delay));
}

async function run(key) {
  const src = SOURCES[key], st = state.status[key];
  if (!src.enabled() || state.demo) return;
  if (st.running) return;
  if (typeof navigator.onLine === 'boolean' && !navigator.onLine) {   // don't burn retries while the OS says offline
    st.lastAttempt = Date.now(); st.lastError = 'offline'; renderStatus(); schedule(key, 60e3); return;
  }
  st.running = true; st.startedAt = st.lastAttempt = Date.now();
  let next = refreshMs();
  try {
    const prev = state.cache[key] && state.cache[key].data;
    const data = await Promise.race([src.load(prev), sleep(90e3).then(() => { throw new Error('refresh took too long'); })]);
    state.cache[key] = { at: Date.now(), data };
    if (!store.set(K.cache + key, state.cache[key])) log('could not persist ' + key + ' cache');
    st.failures = 0; st.lastError = (data.errors || []).join('; ');
  } catch (e) {
    st.failures++; st.lastError = errMsg(e);
    // back off: 30s, 1m, 2m, 4m … capped at the normal refresh interval (min 5 min), with jitter
    next = Math.min(Math.max(refreshMs(), 5 * 60e3), 30e3 * Math.pow(2, st.failures - 1)) * (0.8 + Math.random() * 0.4);
    if (e instanceof TypeError && st.failures <= 3) next = 10e3;      // usually Wi-Fi still reconnecting after sleep
    log(key + ' failed (' + st.failures + '): ' + st.lastError);
  } finally {
    st.running = false;
    safeRender(key);
    renderStatus();
    schedule(key, next);
  }
}

function refreshAll(delay) { Object.keys(SOURCES).forEach(k => schedule(k, delay || 0)); }
let kickTimer = null;
function kickTodoist() { clearTimeout(kickTimer); kickTimer = setTimeout(() => schedule('todoist', 0), 2000); }

/* =====================================================================
   Rendering
   ===================================================================== */
function safeRender(key) {
  const fns = key === 'calendar' ? [renderCalendar] : key === 'todoist' ? [renderTodoist] : [renderCalendar, renderTodoist];
  fns.forEach(fn => { try { fn(); } catch (e) { log('render ' + fn.name + ': ' + e.message); } });
}
const emptyMsg = t => '<div class="empty">' + esc(t) + '</div>';

function renderCalendar() {
  const el = $('#cal-body');
  const c = state.cache.calendar;
  if (!c) { el.innerHTML = emptyMsg(SOURCES.calendar.enabled() || state.demo ? 'Loading calendar…' : 'No calendar set up — long-press the clock.'); $('#cal-legend').innerHTML = ''; return; }
  const meta = {}, dm = c.data.meta || {};
  Object.keys(dm).forEach((id, i) => meta[id] = { label: dm[id].label, color: dm[id].color || PALETTE[i % PALETTE.length] });
  parseCalendars().forEach(x => meta[x.id] = { label: x.label || (meta[x.id] && meta[x.id].label) || '', color: x.color });
  const multi = Object.keys(c.data.byCal || {}).length > 1;
  /* who an event belongs to: its own Google colour (named in settings), else its calendar */
  const who = e => {
    if (e.color && GCOLOUR[e.color]) return { color: GCOLOUR[e.color][2], name: String(cfg['colour_' + e.color] || '').trim() };
    const n0 = String(cfg.colour_0 || '').trim();
    if (n0 || !multi) return { color: cfg.colour0Hex || '#d81b60', name: n0 };   // all uncoloured events look the same
    return { color: e.cal.color, name: e.cal.label };
  };
  const now = new Date(), today = startOfDay(now);
  const events = [];
  Object.keys(c.data.byCal || {}).forEach(id => (c.data.byCal[id] || []).forEach(e => {
    const s = e.allDay ? parseYmd(e.start) : new Date(e.start);
    let en = e.end ? (e.allDay ? parseYmd(e.end) : new Date(e.end)) : s;
    if (isNaN(s)) return; if (isNaN(en) || en < s) en = s;
    const ev = Object.assign({ s, e: en, cal: meta[id] || { color: '#888', label: '' } }, e);
    ev.who = who(ev); events.push(ev);
  }));

  /* key of who's who, from the names actually in use */
  const seen = {};
  events.forEach(e => { if (e.who.name && !seen[e.who.name]) seen[e.who.name] = e.who.color; });
  $('#cal-legend').innerHTML = Object.keys(seen).map(n => '<span><i class="sw" style="background:' + esc(seen[n]) + '"></i>' + esc(n) + '</span>').join('');

  const days = num(cfg.calendarDays, 30);
  let html = '', shownLater = 0;
  for (let i = 0; i < days; i++) {
    const day = addDays(today, i), next = addDays(today, i + 1);
    const evs = events.filter(e => e.s < next && (e.e > day || (+e.e === +e.s && e.s >= day)))
      .sort((a, b) => (b.allDay - a.allDay) || (a.s - b.s) || a.title.localeCompare(b.title));
    if (!evs.length && i >= 2) continue;               // keep a month readable: skip empty days after tomorrow
    if (i >= 2) shownLater++;
    const cls = 'day' + (i === 0 ? ' today' : '') + (!evs.length ? ' quiet' : '');
    html += '<div class="' + cls + '"><div class="day-h">' + esc(dayLabel(day)) + (i > 1 ? '' : '<span style="margin-left:auto;font-weight:400">' + esc(day.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })) + '</span>') + '</div>';
    if (!evs.length && i === 0) html += emptyMsg('Nothing on today');
    if (!evs.length && i === 1) html += emptyMsg('Nothing on tomorrow');
    evs.forEach(e => {
      let t;
      if (e.allDay) t = (e.e - e.s > 864e5 * 1.5 && dayDiff(e.s) < i) ? 'cont.' : 'All day';
      else if (e.s < day) t = 'until ' + fmtTime(e.e);
      else t = fmtTime(e.s);
      const past = i === 0 && !e.allDay && e.e <= now && +e.e !== +e.s ? ' past' : (i === 0 && !e.allDay && +e.e === +e.s && e.s < now ? ' past' : '');
      const live = i === 0 && !e.allDay && e.s <= now && e.e > now ? ' now' : '';
      html += '<div class="ev' + past + live + '"><span class="bar" style="background:' + esc(e.who.color) + '"></span>' +
        '<span class="t">' + esc(live ? 'Now' : t) + '</span><span class="n">' + esc(e.title) +
        (e.who.name ? '<span class="who" style="background:' + esc(e.who.color) + ';color:' + inkFor(e.who.color) + '">' + esc(e.who.name) + '</span>' : '') +
        (e.location ? '<span class="loc">' + esc(e.location) + '</span>' : '') + '</span></div>';
    });
    html += '</div>';
  }
  html += '<div class="cal-end">' + (shownLater ? 'That’s everything for the next ' + days + ' days' : 'Nothing else in the next ' + days + ' days') + '</div>';
  const top = el.scrollTop;                            // keep the reader's place across refreshes
  el.innerHTML = html;
  el.scrollTop = top;
}

/* cached Todoist data + local queue overlay = what the family sees */
function todoView() {
  const c = state.cache.todoist; if (!c) return null;
  const closed = new Set(queue.filter(q => q.op === 'close').map(q => String(q.id)));
  const keep = t => !closed.has(String(t.id));
  const adds = queue.filter(q => q.op === 'add').map(q => ({ id: q.tempId, content: q.content, section: null, order: 1e9 + q.ts, unsynced: true }));
  return { shopping: c.data.shopping.filter(keep).concat(adds), meals: c.data.meals.filter(keep),
    reminders: c.data.reminders.filter(keep), sections: c.data.sections || [], shopId: c.data.shopId };
}

const pendingDone = new Map();   // id -> timer; 4 s grace period to undo a tap
function taskHtml(t, dueHtml) {
  return '<div class="task' + (pendingDone.has(String(t.id)) ? ' pdone' : '') + (t.unsynced ? ' unsynced' : '') + '" data-id="' + esc(t.id) + '">' +
    '<span class="box"></span><span class="c">' + esc(t.content) + '</span>' + (dueHtml || '') + '</div>';
}

function renderTodoist() {
  const v = todoView();
  const off = !SOURCES.todoist.enabled() && !state.demo;
  const placeholder = off ? 'Todoist not set up — long-press the clock.' : 'Loading…';
  $('#shop-add').style.display = v && v.shopId ? '' : 'none';

  /* shopping, grouped by Todoist section (e.g. aisles) */
  if (!v) { ['#shop-body', '#meals-body', '#rem-body'].forEach(s => $(s).innerHTML = emptyMsg(placeholder)); $('#shop-count').textContent = $('#rem-count').textContent = ''; return; }
  const secs = v.sections.slice().sort((a, b) => a.order - b.order);
  const groups = [{ id: null, name: '' }].concat(secs);
  let sh = '';
  groups.forEach(g => {
    const items = v.shopping.filter(t => (t.section || null) === g.id || (g.id === null && t.section && !secs.some(s => s.id === t.section)))
      .sort((a, b) => a.order - b.order);
    if (!items.length) return;
    if (g.name) sh += '<div class="sec">' + esc(g.name) + '</div>';
    items.forEach(t => sh += taskHtml(t));
  });
  $('#shop-body').innerHTML = sh || emptyMsg('List is empty 🎉');
  $('#shop-count').textContent = v.shopping.length ? v.shopping.length : '';

  /* meals for the next N days */
  const today = startOfDay(new Date());
  let mh = '';
  for (let i = 0; i < num(cfg.mealDays, 7); i++) {
    const d = addDays(today, i), key = ymd(d);
    const ms = v.meals.filter(t => t.due && t.due.date.slice(0, 10) === key).sort((a, b) => (dueDate(a.due) - dueDate(b.due)) || a.order - b.order);
    mh += '<div class="meal' + (i === 0 ? ' today' : '') + '"><span class="d">' + esc(i === 0 ? 'Today' : d.toLocaleDateString([], { weekday: 'short' })) + '</span>' +
      '<span class="m' + (ms.length ? '' : ' none') + '">' + (ms.length ? ms.map(t => esc(t.content)).join('<br>') : '—') + '</span></div>';
  }
  $('#meals-body').innerHTML = mh;

  /* reminders, soonest first */
  const rem = v.reminders.slice().sort((a, b) => {
    const da = dueDate(a.due), db = dueDate(b.due);
    if (!da && !db) return a.order - b.order; if (!da) return 1; if (!db) return -1; return da - db;
  });
  const now = new Date();
  $('#rem-body').innerHTML = rem.length ? rem.map(t => {
    const d = dueDate(t.due); let label = '', over = false;
    if (d) {
      const n = dayDiff(d);
      over = dueHasTime(t.due) ? d < now : n < 0;
      label = (n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : n < 0 ? 'Overdue' : d.toLocaleDateString([], { weekday: 'short' })) + (dueHasTime(t.due) ? ' ' + fmtTime(d) : '');
      if (n < 0) label = 'Overdue · ' + d.toLocaleDateString([], { weekday: 'short', day: 'numeric' });
    }
    return taskHtml(t, '<span class="due' + (over ? ' over' : '') + '">' + esc(label) + (t.due && t.due.recurring ? ' ↻' : '') + '</span>');
  }).join('') : emptyMsg('All clear');
  $('#rem-count').textContent = rem.length ? rem.length : '';
}

function renderStatus() {
  const bits = [];
  if (navigator.onLine === false) bits.push('<span class="st"><span class="dot bad"></span>Offline</span>');
  Object.keys(SOURCES).forEach(k => {
    const src = SOURCES[k]; if (!src.enabled() || state.demo) return;
    const st = state.status[k], c = state.cache[k];
    const stale = !c || Date.now() - c.at > refreshMs() * 3 + 60e3;
    let cls = 'ok', text = src.name;
    if (!c && st.failures) { cls = 'bad'; text += ' · ' + st.lastError; }
    else if (st.failures || stale) { cls = 'warn'; text += c ? ' · updated ' + ago(c.at) : ' · loading'; }
    else if (st.lastError) { cls = 'warn'; }
    bits.push('<span class="st" title="' + esc(st.lastError) + '"><span class="dot ' + cls + '"></span>' + esc(text) + '</span>');

function setBrightness(v) {

function inNight(d) {
  const s = toMin(cfg.nightStart), e = toMin(cfg.nightEnd); if (s == null || e == null || s === e) return false;
  const m = d.getHours() * 60 + d.getMinutes();
  return s < e ? (m >= s && m < e) : (m >= s || m < e);
}
let wakeUntil = 0, swallowClick = false;

  const night = inNight(new Date()) && Date.now() > wakeUntil;

/* Reload only when the page itself can be fetched — otherwise a reload while offline would leave a blank screen. */
async function safeReload(reason) {
  log('reload: ' + reason);
  if (location.protocol === 'file:') return location.reload();
  try {
    // goes through the service worker if one is installed, so this also succeeds offline when the shell is cached
    const r = await Promise.race([fetch(location.href.split('#')[0], { cache: 'no-store' }), sleep(8000).then(() => null)]);
    if (r && r.ok) return location.reload();
  } catch (e) {}
  log('reload skipped, page unreachable');
}

let lastMinute = -1, lastDay = ymd(new Date());
/* Watchdog: the tablet freezes the page's timers while the screen is dimmed or another app is open.
   Spot an overdue refresh within ~20 s of waking and run it, giving Wi-Fi a few seconds to come back. */
let lastWatch = 0, lastTickAt = Date.now();
function watchdog() {
  const now = Date.now(), slept = now - lastTickAt > 30e3;
  lastTickAt = now;
  if (now - lastWatch < 20e3 && !slept) return;
  lastWatch = now;
  if (slept) { renderStatus(); }
  Object.keys(SOURCES).forEach(k => {
    const st = state.status[k]; if (!SOURCES[k].enabled() || state.demo) return;
    if (st.running && now - st.startedAt > 3 * 60e3) { st.running = false; log(k + ' run hung, resetting'); }
    const due = (state.due && state.due[k]) || 0;
    if (!st.running && now > due + 30e3) { log(k + ' timer lost, re-arming'); schedule(k, slept ? 4000 : 0); }
  });
}
/* any touch: if the lists are more than a few minutes old, refresh now */
function refreshIfStale(delay) {
  Object.keys(SOURCES).forEach(k => {
    const c = state.cache[k], st = state.status[k];
    if (!SOURCES[k].enabled() || state.demo || st.running) return;
    if (!c || Date.now() - c.at > Math.min(refreshMs(), 3 * 60e3)) schedule(k, delay || 0);
  });
}
document.addEventListener('pointerdown', () => refreshIfStale(0), true);

function tick() {
  try { watchdog(); } catch (e) {}
  const now = new Date();
  if (board.paused) return;           // nothing to draw while another app is in front
  $('#clock').textContent = fmtTime(now);
  try { saverTick(now); } catch (e) { log('saver: ' + e.message); stopSaver(); }
  if (now.getMinutes() === lastMinute) return;
  lastMinute = now.getMinutes();
  $('#date').textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  applyNight();

  if (ymd(now) !== lastDay) { lastDay = ymd(now); refreshAll(5000); }    // new day: new date window
  safeRender(); renderStatus();

  // burn-in protection: drift the whole layout a few pixels every 10 minutes
  if (now.getMinutes() % 10 === 0) $('#app').style.transform = 'translate(' + Math.round(Math.random() * 8 - 4) + 'px,' + Math.round(Math.random() * 6 - 3) + 'px)';


  applyDecor();

  // after 2 minutes untouched, scroll every list back to the top (today)
  if (Date.now() - photos.lastTouch > 120e3) document.querySelectorAll('.body').forEach(b => { if (b.scrollTop) b.scrollTop = 0; });

  // photo list: re-check every 6 h, or every 30 min while photos are still downloading
  if (photosEnabled() && !photos.syncing && Date.now() - photos.lastSync > (photos.have.size < photos.list.length ? 30 : 360) * 60e3) syncPhotos();

  // daily reload to shed memory leaks in long-running WebViews
  if (cfg.reloadAt && fmtHM(now) === cfg.reloadAt && Date.now() - state.bootAt > 3600e3) safeReload('daily');
}

   fetched through the Apps Script helper and kept on the tablet (Cache Storage),
   so the slideshow also works offline.
   ===================================================================== */
const PHOTO_CACHE = 'kb-photos-v2';      // v2: photos stored already turned the right way up
const photos = { list: store.get('kb.photos', []), have: new Set(), bad: new Set(), lastSync: 0, syncing: false, err: '',
  active: false, deck: store.get('kb.photoDeck', []), next: 0, lastTouch: Date.now(), urls: [], layer: 0 };

const helperUrl = q => { const u = String(cfg.calendarScriptUrl).trim(); return u + (u.includes('?') ? '&' : '?') + q; };

/* Phones often save photos sideways plus an EXIF note saying which way up they go.
   Some WebViews ignore that note, so read it ourselves, turn the pixels the right way
   up on a canvas, and store a plain upright JPEG (also shrunk to at most 1600px). */
function jpegOrientation(b) {
  if (b[0] !== 0xFF || b[1] !== 0xD8) return { o: 1 };
  let i = 2;
  while (i + 10 < b.length) {
    if (b[i] !== 0xFF) return { o: 1 };

    photos.list = r.photos.map(p => String(p.id)); store.set('kb.photos', photos.list);

function renderSaverInfo() {
  const now = new Date();
  $('#sv-date').textContent = now.toLocaleDateString([], { weekday: 'long', day: 'numeric', month: 'long' });
  const items = [];
  /* calendar: what's on now / next, today and tomorrow */
  const c = state.cache.calendar;
  if (c) {
    const tomorrowEnd = addDays(startOfDay(now), 2), evs = [];
    Object.keys(c.data.byCal || {}).forEach(id => (c.data.byCal[id] || []).forEach(e => {
      const s = e.allDay ? parseYmd(e.start) : new Date(e.start), en = e.end ? (e.allDay ? parseYmd(e.end) : new Date(e.end)) : s;
      if (isNaN(s)) return;
      if (e.allDay ? (dayDiff(s) <= 0 && en > startOfDay(now)) : (en > now && s < tomorrowEnd)) evs.push({ s, allDay: e.allDay, title: e.title });
    }));
    evs.sort((a, b) => (b.allDay - a.allDay) || (a.s - b.s));
    evs.slice(0, 2).forEach(e => {
      const when = e.allDay ? 'Today' : e.s <= now ? 'Now' : (dayDiff(e.s) === 0 ? '' : 'Tomorrow ') + fmtTime(e.s);
      items.push('<div><span class="lbl">' + esc(when) + '</span>' + esc(e.title) + '</div>');
    });
  }
  /* tonight's dinner and reminders due today */
  const v = todoView();
  if (v) {
    const meal = v.meals.filter(t => t.due && t.due.date.slice(0, 10) === ymd(now));
    if (meal.length) items.push('<div><span class="lbl">Dinner</span>' + esc(meal.map(t => t.content).join(', ')) + '</div>');
    const due = v.reminders.filter(t => { const d = dueDate(t.due); return d && dayDiff(d) <= 0; });
    if (due.length) items.push('<div class="' + (due.some(t => dayDiff(dueDate(t.due)) < 0) ? 'over' : '') + '"><span class="lbl">To do</span>' +
      esc(due.slice(0, 2).map(t => t.content).join(', ')) + (due.length > 2 ? ' +' + (due.length - 2) : '') + '</div>');
  }
  $('#sv-items').innerHTML = items.join('');
}

function easterSunday(y) {     // Anonymous Gregorian algorithm
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}

function datesToday(list, d) {
  return String(list || '').split('\n').map(l => {
    const m = /^\s*(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*(?:\|\s*(.*))?$/.exec(l); if (!m) return null;
    return { d: +m[1], m: +m[2], name: (m[3] || '').trim() };
  }).filter(b => b && b.d === d.getDate() && b.m === d.getMonth() + 1);
}

function pickTheme(d) {
  if (decor.preview && Date.now() < decor.preview.until) return decor.preview;
  decor.preview = null;
  if (cfg.decorations === 'off') return null;
  const month = d.getMonth() + 1, md = month * 100 + d.getDate();
  const names = l => l.map(b => b.name).filter(Boolean).join(' & ');
  const bdays = datesToday(cfg.birthdays, d);
  if (bdays.length) return { key: 'birthday', name: names(bdays) };
  const anniv = datesToday(cfg.anniversaries, d);
  if (anniv.length) return { key: 'anniversary', name: names(anniv) };
  const fromEaster = Math.round((startOfDay(d) - easterSunday(d.getFullYear())) / 864e5);
  if (fromEaster === -21) return { key: 'mothers' };                    // UK Mothering Sunday
  if (month === 6 && d.getDay() === 0 && d.getDate() >= 15 && d.getDate() <= 21) return { key: 'fathers' };   // third Sunday in June
  if (md === 214) return { key: 'valentine' };
  if (md === 1105) return { key: 'bonfire' };
  if (md === 1231) return { key: 'newyear' };
  if (fromEaster >= -7 && fromEaster <= 1) return { key: 'easter' };
  if (md >= 1024 && md <= 1031) return { key: 'halloween' };
  const sh = /(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*[-–to ]+\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})/.exec(String(cfg.summerHolidays || ''));
  if (sh && md >= +sh[2] * 100 + +sh[1] && md <= +sh[4] * 100 + +sh[3]) return { key: 'summer' };
  if (month === 11) return { key: 'autumn' };
  if (month === 12) return { key: 'christmas' };

}

    mum: [{ title: 'Dentist', start: at(0, 9, 30), end: at(0, 10, 15), location: 'High St Dental' }, { title: 'Book club', start: at(2, 19, 30), end: at(2, 21) }],
    kids: [{ title: 'Swimming', start: at(0, 16, 30), end: at(0, 17, 30), location: 'Leisure centre' }, { title: 'Football', start: at(1, 17), end: at(1, 18) }, { title: 'School trip', allDay: true, start: ymd(addDays(t, 3)), end: ymd(addDays(t, 4)) }],
    family: [{ title: 'Bin day', allDay: true, start: ymd(addDays(t, 1)), end: ymd(addDays(t, 2)) }, { title: 'Grandma visiting', allDay: true, start: ymd(addDays(t, 4)), end: ymd(addDays(t, 7)) }, { title: 'Dinner at the Patels', start: at(5, 18, 30), end: at(5, 21) }]
  }, errors: [] } };
  const task = (id, content, extra) => Object.assign({ id: 'd' + id, content, order: id, section: null, due: null }, extra);
  state.cache.todoist = { at: Date.now(), data: { shopId: 'demo',
    sections: [{ id: 's1', name: 'Fruit & veg', order: 1 }, { id: 's2', name: 'Dairy', order: 2 }, { id: 's3', name: 'Cupboard', order: 3 }],
    shopping: [task(1, 'Bananas', { section: 's1' }), task(2, 'Spinach', { section: 's1' }), task(3, 'Milk (2 pints)', { section: 's2' }), task(4, 'Cheddar', { section: 's2' }), task(5, 'Pasta', { section: 's3' }), task(6, 'Chopped tomatoes ×2', { section: 's3' }), task(7, 'Birthday card')],
    meals: ['Spaghetti bolognese', 'Fish tacos', 'Chicken curry', 'Leftovers', 'Homemade pizza', 'Roast chicken'].map((m, i) => task(20 + i, m, { due: { date: ymd(addDays(t, i)) } })),
    reminders: [task(30, 'Put the bins out', { due: { date: ymd(t) + 'T19:00:00', recurring: true } }), task(31, 'Sign school trip form', { due: { date: ymd(addDays(t, -1)) } }), task(32, 'Water the plants', { due: { date: ymd(addDays(t, 1)), recurring: true } }), task(33, 'Order Grandma’s birthday present', { due: { date: ymd(addDays(t, 2)) } })],
    errors: [] } };
}

/* =====================================================================
   Boot
   ===================================================================== */
(function boot() {
  state.demo = !Object.keys(SOURCES).some(k => SOURCES[k].enabled());
  if (state.demo) loadDemo();
  renderBanner();
  renderApps();
  tick(); setInterval(tick, 1000);
  safeRender(); renderStatus();
  // stagger the first fetches a little so a cold boot doesn't hit everything at once
  Object.keys(SOURCES).forEach((k, i) => schedule(k, 500 + i * 1500));
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(e => log('sw: ' + e.message));
  if (/[?&]settings\b/.test(location.search)) openSettings();
  migratePhotoCache().then(refreshHave).then(() => { if (photosEnabled()) setTimeout(syncPhotos, 20000); });
  log('started' + (state.demo ? ' (demo)' : ''));
})();
</script>
